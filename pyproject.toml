[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turbogen-mcp"
version = "0.1.5"
description = "MCP server for Turbogen: Seedance, Kling, Veo, Nano Banana Pro and more - images, video and audio, pay-as-you-go"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Turbogen", email = "hello@turbogen.app" }]
keywords = ["mcp", "model-context-protocol", "ai-video", "ai-image", "seedance", "kling", "veo", "nano-banana", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://turbogen.app"
Documentation = "https://turbogen.app/api-docs#mcp"
Pricing = "https://turbogen.app/pricing"
Repository = "https://github.com/turbogenai/turbogen-mcp"
Issues = "https://github.com/turbogenai/turbogen-mcp/issues"

[project.scripts]
turbogen-mcp = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "LICENSE"]
